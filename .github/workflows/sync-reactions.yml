name: Sync Reaction Counts

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch counts from CounterAPI
        run: |
          python3 << 'EOF'
          import urllib.request, json, time, os

          NS       = 'ulloaseverinolab'
          NEWS_IDS = [
            'cagla-visit-jun26',
            'francesca-welcome-jun26',
            'marta-astrocafe-jun26',
            'lab-lunch-may26',
          ]
          REACTIONS = ['heart', 'clap', 'thumbsup']

          # Load existing counts so we never go backwards
          existing = {}
          try:
            with open('data/reactions.json') as f:
              existing = json.load(f)
          except Exception:
            pass

          counts = {}
          for news_id in NEWS_IDS:
            counts[news_id] = {}
            for reaction in REACTIONS:
              url = f'https://api.counterapi.dev/v1/{NS}/news-{news_id}-{reaction}'
              try:
                with urllib.request.urlopen(url, timeout=10) as resp:
                  data = json.loads(resp.read())
                  counts[news_id][reaction] = data.get('count', 0)
              except Exception as e:
                # Keep previous value on error rather than resetting to 0
                counts[news_id][reaction] = (
                  existing.get(news_id, {}).get(reaction, 0))
                print(f'Warning: {news_id}-{reaction}: {e}')
              time.sleep(0.35)   # stay under 30 req/min

          os.makedirs('data', exist_ok=True)
          with open('data/reactions.json', 'w') as f:
            json.dump(counts, f, indent=2)
          print(json.dumps(counts, indent=2))
          EOF

      - name: Commit updated counts
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/reactions.json
          git diff --staged --quiet || git commit -m 'chore: sync reaction counts [skip ci]'
          git push
