name: Sync Reaction Counts

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch counts and update JSON
        run: python3 .github/scripts/sync_reactions.py

      - name: Commit updated counts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/reactions.json
          git diff --staged --quiet && echo "No changes" || git commit -m 'chore: sync reaction counts [skip ci]'
          git diff HEAD~1 --quiet 2>/dev/null && echo "Nothing to push" || git push
